services:
  aws-copier:
    # `image:` names the tag `docker load -i aws-copier-*.tar.gz` produces, so
    # `docker compose up -d` (no --build) uses an image built elsewhere and copied over —
    # see docker/build-and-export.sh. `build: .` is also here so building in place on the
    # NAS with `docker compose up -d --build` still works if you'd rather do that instead.
    image: aws-copier:latest
    build: .
    container_name: aws-copier
    restart: unless-stopped
    environment:
      # UID/GID the daemon runs as inside the container — match the owner of your NAS
      # shares so uploaded-file bookkeeping (.milo_backup.info) isn't written as root.
      # On UGreen NAS, check an existing share's owner with `ls -n /volumeX/your-share`.
      - PUID=1000
      - PGID=10
      - TZ=UTC
    volumes:
      # Credentials + watch_folders/S3 settings — see config.yaml. Read-only: the daemon
      # never needs to write to this file.
      - ./config.yaml:/app/config.yaml:ro

      # One line per folder you want backed up. The container path (right of the colon)
      # must match a key under `watch_folders` in config.yaml.
      - /volume1/pictures:/data/pictures

    ports:
      # Live log/status dashboard (aws_copier/web/dashboard.py). Drop this mapping, or set
      # web_enabled: false in config.yaml, if you don't want it reachable from the LAN.
      - "8765:8765"
